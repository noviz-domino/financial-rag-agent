<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#64748b; }
      .node-title { font: 700 19px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#0f172a; }
      .node-text { font: 400 15px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#334155; }
      .label { font: 600 14px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#334155; }
      .small { font: 400 13px 'Segoe UI', 'Malgun Gothic', sans-serif; fill:#64748b; }
      .box { stroke-width:2; rx:14; filter:url(#shadow); }
      .edge { stroke:#475569; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .dashed { stroke-dasharray:7 6; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#f8fafc"/>
  <text x="750" y="48" text-anchor="middle" class="title">Financial RAG Agent — LangGraph 흐름</text>
  <text x="750" y="76" text-anchor="middle" class="subtitle">검색 결과를 먼저 확인한 뒤, 근거 충분성·안전성·인용을 순차적으로 판단</text>

  <!-- main nodes -->
  <rect x="620" y="105" width="260" height="66" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="750" y="135" text-anchor="middle" class="node-title">START</text>
  <text x="750" y="157" text-anchor="middle" class="node-text">질문과 검색 범위(scope) 입력</text>

  <rect x="585" y="215" width="330" height="88" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="750" y="250" text-anchor="middle" class="node-title">retrieve</text>
  <text x="750" y="274" text-anchor="middle" class="node-text">벡터 / BM25 / 하이브리드 검색</text>
  <text x="750" y="294" text-anchor="middle" class="small">첫 검색은 질문, 재검색은 rewrite 검색어</text>

  <polygon points="750,345 930,430 750,515 570,430" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="420" text-anchor="middle" class="node-title">grade</text>
  <text x="750" y="443" text-anchor="middle" class="node-text">근거 충분? 인젝션? 다음 행동?</text>

  <rect x="585" y="555" width="330" height="88" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="590" text-anchor="middle" class="node-title">generate</text>
  <text x="750" y="614" text-anchor="middle" class="node-text">근거 기반 답변 + 출처 생성</text>
  <text x="750" y="634" text-anchor="middle" class="small">answer / qualified / correct</text>

  <polygon points="750,685 900,755 750,825 600,755" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="750" text-anchor="middle" class="node-title">verify</text>
  <text x="750" y="773" text-anchor="middle" class="node-text">인용·숫자·근거 규칙 검사</text>

  <rect x="650" y="875" width="200" height="62" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="750" y="912" text-anchor="middle" class="node-title">END</text>

  <!-- side terminal nodes -->
  <rect x="1050" y="330" width="260" height="58" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1180" y="365" text-anchor="middle" class="node-title">refuse · 부적절한 요청</text>
  <rect x="1050" y="410" width="260" height="58" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="445" text-anchor="middle" class="node-title">clarify · 조건 부족</text>
  <rect x="1050" y="490" width="260" height="58" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="525" text-anchor="middle" class="node-title">defer · 최신성 문제</text>
  <rect x="1050" y="570" width="260" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1180" y="607" text-anchor="middle" class="node-title">abstain · 근거 부족</text>

  <rect x="145" y="395" width="270" height="86" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="280" y="430" text-anchor="middle" class="node-title">rewrite</text>
  <text x="280" y="454" text-anchor="middle" class="node-text">검색어 재작성</text>
  <text x="280" y="474" text-anchor="middle" class="small">최대 재검색 2회</text>

  <rect x="1010" y="685" width="300" height="86" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1160" y="720" text-anchor="middle" class="node-title">expand</text>
  <text x="1160" y="744" text-anchor="middle" class="node-text">참조 조항·그림·parent 보완</text>
  <text x="1160" y="764" text-anchor="middle" class="small">설정 agent.expand=true일 때</text>

  <!-- main edges -->
  <path d="M750 171 L750 215" class="edge"/>
  <path d="M750 303 L750 345" class="edge"/>
  <path d="M750 515 L750 555" class="edge"/>
  <path d="M750 643 L750 685" class="edge"/>
  <path d="M750 825 L750 875" class="edge"/>
  <text x="770" y="858" class="label">pass</text>

  <!-- grade branches -->
  <path d="M930 430 L1050 359" class="edge"/>
  <text x="956" y="387" class="label">refuse</text>
  <path d="M930 445 L1050 439" class="edge"/>
  <text x="958" y="435" class="label">clarify</text>
  <path d="M930 465 L1050 519" class="edge"/>
  <text x="956" y="505" class="label">freshness</text>
  <path d="M570 430 L415 430" class="edge"/>
  <text x="447" y="416" class="label">retry</text>
  <path d="M280 395 C280 250 480 190 585 250" class="edge"/>
  <text x="345" y="285" class="label">재검색</text>
  <path d="M750 515 L750 555" class="edge"/>
  <text x="770" y="542" class="label">sufficient</text>
  <path d="M875 475 L980 475 L980 710 L1010 710" class="edge dashed"/>
  <text x="945" y="462" class="label">link</text>
  <path d="M1010 730 L950 730 L950 599 L915 599" class="edge"/>
  <text x="965" y="716" class="label">보완 후</text>
  <path d="M930 490 L1000 490 L1000 600 L1050 600" class="edge"/>
  <text x="1010" y="535" class="label">한도 초과</text>

  <!-- verify branches -->
  <path d="M900 770 L950 820 L1370 820 L1370 970 L850 970" class="edge"/>
  <text x="1000" y="808" class="label">fail / 재생성 한도</text>
  <path d="M600 755 L500 755 L500 599 L585 599" class="edge dashed"/>
  <text x="465" y="735" class="label">regen</text>

  <!-- terminal arrows -->
  <path d="M1310 359 L1370 359 L1370 970 L850 970" class="edge"/>
  <path d="M1310 439 L1370 439" class="edge"/>
  <path d="M1310 519 L1370 519" class="edge"/>
  <path d="M1310 601 L1370 601" class="edge"/>
  <text x="1220" y="900" class="small">모든 정형 응답은 외곽 종료선으로 END</text>

  <!-- legend -->
  <rect x="75" y="1010" width="1350" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="1038" class="label">제한:</text>
  <text x="160" y="1038" class="small">AI 호출 최대 7회 · 재검색 최대 2회 · 답변 재생성 최대 1회</text>
  <text x="100" y="1063" class="label">안전:</text>
  <text x="160" y="1063" class="small">근거 없는 숫자·인용은 verify에서 실패 처리하고, 해결되지 않으면 abstain으로 종료</text>
</svg>
